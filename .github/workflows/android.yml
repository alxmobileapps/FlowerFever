name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # lets the build save the signed AAB to the play-upload branch
    env:
      # Add these 4 repository secrets to get a signed release (for Google Play)
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Capacitor + plugins (AdMob, Google Play Billing, notifications)
        run: |
          npm install
          if [ -f google-services.json ]; then
            echo "Firebase config found: adding Google sign-in, cloud save (Firestore) and Analytics"
            npm install @capacitor-firebase/analytics@^7 @capacitor-firebase/authentication@7.5.0 @capacitor-firebase/firestore@^7 firebase@^11
            python scripts/patch-google-signin.py
            echo "window.FLOWER_FIREBASE = true;" > www/firebase-config.js
          fi

      - name: Install Android 36 SDK (Google Play needs target API 36)
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-36" "build-tools;36.0.0" || echo "::warning::could not pre-install SDK 36, Gradle will try"

      - name: Create Android project
        run: |
          npx cap add android
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; fi

      - name: Game setup (portrait, fullscreen, AdMob, icons, version)
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          pip install pillow
          python scripts/patch-admob-banner.py
          git apply scripts/board-webgl.patch
          git apply scripts/celebration-polish.patch
          git apply scripts/webgl-effects.patch
          git apply --unidiff-zero scripts/home-and-offers.patch
          python scripts/patch-portal-refill.py
          python scripts/android-setup.py

      - name: Build debug APK (Google test ads, safe to play on your own phone)
        run: |
          # android-setup.py explicitly selects the registered debug signing key.
          sed -i "s/testing: false/testing: true/" www/ads-config.js
          npx cap sync android
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../dist
          # Check the actual APK, not just the source keystore.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/debug/app-debug.apk
          OUT=../dist/flower-fever-debug-TEST-ADS.apk
          EXPECTED=51bd417b2935550c228f022ffc2f3be1bfeaf327
          "$BT/apksigner" verify --print-certs "$APK" | tee ../dist/debug-signing-report.txt
          if grep -Fqi "$EXPECTED" ../dist/debug-signing-report.txt; then
            cp "$APK" "$OUT"
          else
            echo "Signing the test APK with the registered Flower Fever debug key"
            "$BT/apksigner" sign --ks app/flower-fever-debug.keystore --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android --out "$OUT" "$APK"
            "$BT/apksigner" verify --print-certs "$OUT" | tee ../dist/debug-signing-report.txt
            grep -Fqi "$EXPECTED" ../dist/debug-signing-report.txt
          fi

      - name: Build release AAB + APK (real ads)
        run: |
          git checkout -- www/ads-config.js
          grep -q "testing: false" www/ads-config.js || echo "::warning::ads-config.js has testing: true - the release will show test ads"
          grep -q "3940256099942544" www/ads-config.js && echo "::warning::ads-config.js still has Google TEST ad ids - put the real Flower Fever AdMob ids in before publishing"
          npx cap sync android
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Sign release APK + AAB
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          KP="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cp android/app/build/outputs/bundle/release/app-release.aab dist/flower-fever-release.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KP" dist/flower-fever-release.aab "$KEY_ALIAS"
          "$BT/zipalign" -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:KEYSTORE_PASSWORD --key-pass pass:"$KP" \
            --ks-key-alias "$KEY_ALIAS" --out dist/flower-fever-release.apk aligned.apk
          rm -f release.keystore aligned.apk

      - name: Save signed AAB to the play-upload branch (for uploading to Play Console)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p /tmp/pu && cp dist/flower-fever-release.aab /tmp/pu/
          cd /tmp/pu && git init -q -b play-upload
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -q -m "Signed AAB from run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" play-upload

      - name: Upload app files
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: flower-fever-android
          path: dist/
          retention-days: 3
